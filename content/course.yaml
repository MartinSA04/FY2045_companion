# ── Formelsamling ────────────────────────────────────────────────────────────
# Hvilke formler som står på årets vedlegg til eksamen er ikke verifisert, så
# ingen rader gjør onSheet/memorize-krav.
formulas:
  - id: planck-stralingslov
    tex: "u(\\nu, T) = \\dfrac{8\\pi\\nu^2}{c^3}\\,\\dfrac{h\\nu}{e^{h\\nu/k_BT} - 1}"
    label: "Plancks strålingslov: spektral energitetthet i et hulrom med temperatur $T$."
    section: "Repetisjon og postulater"
  - id: fotoelektrisk-likning
    tex: "E_{\\text{kin}} = h\\nu - W"
    label: "Einsteins fotoelektriske likning. $W$ er frigjøringsarbeidet for metallet."
    section: "Repetisjon og postulater"
  - id: foton-energi-impuls
    tex: "E_\\gamma = h\\nu, \\qquad p_\\gamma = \\dfrac{E_\\gamma}{c} = \\dfrac{h}{\\lambda}"
    label: "Fotonets energi og impuls."
    section: "Repetisjon og postulater"
  - id: compton-relasjonen
    tex: "\\lambda' - \\lambda = \\dfrac{h}{m_e c}\\,(1 - \\cos\\theta)"
    label: "Compton-relasjonen for spredning av et foton på et fritt elektron."
    section: "Repetisjon og postulater"
  - id: bohr-energier
    tex: "E_n = -\\dfrac{hcR_\\infty}{n^2} \\approx -\\dfrac{13{,}6\\ \\text{eV}}{n^2}"
    label: "Energinivåene i hydrogen, $n = 1, 2, 3, \\dots$"
    section: "Repetisjon og postulater"
  - id: de-broglie-relasjonene
    tex: "\\lambda = \\dfrac{h}{p}, \\qquad \\nu = \\dfrac{E}{h}"
    label: "de Broglie-relasjonene: bølgelengde og frekvens for en partikkel."
    section: "Repetisjon og postulater"

  - id: schrodingerlikningen
    tex: "i\\hbar\\,\\dfrac{\\partial\\Psi}{\\partial t} = \\hat H\\,\\Psi"
    label: "Schrödingerlikningen: kvantemekanikkens bevegelseslikning."
    section: "Repetisjon og postulater"
  - id: forventningsverdi
    tex: "\\langle F \\rangle_\\Psi = \\int \\Psi^* \\hat F\\, \\Psi\\, d\\tau"
    label: "Forventningsverdien av observabelen $F$ i tilstanden $\\Psi$."
    section: "Repetisjon og postulater"
  - id: sannsynlighet-degenerert
    tex: "P_n = \\sum_{i=1}^{g_n} |c_{ni}|^2"
    label: "Sannsynligheten for å måle en degenerert egenverdi $f_n$ med degenerasjonsgrad $g_n$."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: tidsutvikling-forventningsverdi
    tex: "\\dfrac{d}{dt}\\langle F \\rangle = \\dfrac{i}{\\hbar}\\,\\bigl\\langle [\\hat H, \\hat F] \\bigr\\rangle + \\Bigl\\langle \\dfrac{\\partial \\hat F}{\\partial t} \\Bigr\\rangle"
    label: "Tidsutviklingen til en forventningsverdi. Kommuterer en tidsuavhengig $\\hat F$ med $\\hat H$, er $F$ en bevegelseskonstant."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: impuls-egenfunksjoner
    tex: "\\psi_p(x) = (2\\pi\\hbar)^{-1/2}\\, e^{ipx/\\hbar}"
    label: "Impulsegenfunksjonene, deltafunksjonsnormerte."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: impulsrom-bolgefunksjon
    tex: "\\Phi(p, t) = \\int_{-\\infty}^{\\infty} \\psi_p^*(x)\\, \\Psi(x, t)\\, dx"
    label: "Bølgefunksjonen i impulsrommet. $|\\Phi(p, t)|^2$ er sannsynlighetstettheten for impulsen."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: ehrenfests-teorem
    tex: "\\begin{aligned} \\dfrac{d\\langle x \\rangle}{dt} &= \\dfrac{\\langle p \\rangle}{m}, \\\\[4pt] \\dfrac{d\\langle p \\rangle}{dt} &= -\\langle V'(x) \\rangle \\end{aligned}"
    label: "Ehrenfests teorem: bevegelseslikningene for $\\langle x \\rangle$ og $\\langle p \\rangle$ når $\\hat H = \\hat p^2/2m + V(x)$."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: delta-normering
    tex: "\\int \\psi_{p'}^*\\,\\psi_p\\,dx = \\delta(p - p')"
    label: "Deltafunksjonsnormering av egenfunksjoner med kontinuerlig spektrum."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: impulsrom-operatorer
    tex: "\\hat p = p, \\qquad \\hat x = -\\dfrac{\\hbar}{i}\\,\\dfrac{\\partial}{\\partial p}"
    label: "Operatorene i impulsrommet. $\\Phi(p, t)$ følger Schrödingerlikningen med samme $\\hat H$."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: skalarprodukt-dirac
    tex: "\\begin{aligned} \\langle a|b\\rangle &= \\langle b|a\\rangle^*, \\\\[2pt] c\\,|a\\rangle &\\;\\leftrightarrow\\; c^*\\langle a| \\end{aligned}"
    label: "Skalarproduktet i Diracnotasjon, og den duale vektoren til $c\\,|a\\rangle$."
    section: "Diracnotasjon og representasjoner"
  - id: komponenter-tre-basiser
    tex: "\\begin{aligned} \\psi(x) &= \\langle x|\\psi\\rangle, \\\\[2pt] \\Phi(p) &= \\langle p|\\psi\\rangle, \\\\[2pt] c_n &= \\langle n|\\psi\\rangle \\end{aligned}"
    label: "Bølgefunksjonene og utviklingskoeffisientene er komponentene til $|\\psi\\rangle$ i tre basiser."
    section: "Diracnotasjon og representasjoner"
  - id: fullstendighetsrelasjonen
    tex: "\\begin{aligned} \\sum_n |n\\rangle\\langle n| &= \\mathbb{1}, \\\\[2pt] \\int dx\\,|x\\rangle\\langle x| &= \\mathbb{1} \\end{aligned}"
    label: "Fullstendighetsrelasjonen for en diskret og en kontinuerlig basis. Settes inn for å bytte basis."
    section: "Diracnotasjon og representasjoner"
  - id: adjungert-operator
    tex: "\\begin{aligned} \\langle a|\\hat A^\\dagger|b\\rangle &= \\langle b|\\hat A|a\\rangle^*, \\\\[2pt] (\\hat A\\hat B)^\\dagger &= \\hat B^\\dagger\\hat A^\\dagger \\end{aligned}"
    label: "Den adjungerte operatoren og produktregelen. En hermitesk operator har $\\hat A^\\dagger = \\hat A$."
    section: "Diracnotasjon og representasjoner"
  - id: spektralrepresentasjon
    tex: "\\begin{aligned} \\hat F &= \\sum_n |f_n\\rangle f_n\\langle f_n| \\\\[2pt] \\hat F &= \\int df\\,|f\\rangle f\\langle f| \\end{aligned}"
    label: "Spektralrepresentasjonen av en operator, for diskret spektrum $f_n$ (øverst) og kontinuerlig spektrum $f$ (nederst)."
    section: "Diracnotasjon og representasjoner"
  - id: forventningsverdi-dirac
    tex: "\\begin{aligned} \\langle F\\rangle &= \\langle\\Psi|\\hat F|\\Psi\\rangle \\\\[2pt] &= \\sum_n f_n\\,|\\langle f_n|\\Psi\\rangle|^2 \\end{aligned}"
    label: "Forventningsverdien i generell formulering. $|\\langle f_n|\\Psi\\rangle|^2$ er sannsynligheten for $f_n$."
    section: "Diracnotasjon og representasjoner"
  - id: schrodinger-generell
    tex: "i\\hbar\\,\\dfrac{d}{dt}|\\Psi, t\\rangle = \\hat H\\,|\\Psi, t\\rangle"
    label: "Schrödingerlikningen for tilstandsvektoren. Projisert på $\\langle x|$ gir den bølgelikningen."
    section: "Diracnotasjon og representasjoner"
  - id: impuls-matriseelement
    tex: "\\langle x''|\\hat p|x'\\rangle = \\dfrac{\\hbar}{i}\\,\\dfrac{\\partial}{\\partial x''}\\,\\delta(x'' - x')"
    label: "Matriseelementet til impulsoperatoren i posisjonsbasisen, utledet fra $[\\hat x, \\hat p] = i\\hbar$."
    section: "Diracnotasjon og representasjoner"
  - id: overlapp-x-p
    tex: "\\langle x|p\\rangle = \\dfrac{1}{\\sqrt{2\\pi\\hbar}}\\,e^{ipx/\\hbar}"
    label: "Overlappet mellom posisjons- og impulsbasisen. Gir $\\Psi(x) = \\int dp\\,\\langle x|p\\rangle\\,\\Phi(p)$."
    section: "Diracnotasjon og representasjoner"
# ── Begreper ─────────────────────────────────────────────────────────────────
glossary:
  - term: "Foton"
    definition: "Lyskvantet. Har energi $E = h\\nu$ og impuls $p = h/\\lambda$."
    section: "Repetisjon og postulater"
  - term: "Frigjøringsarbeid"
    definition: "Energien $W$ som må til for å løsrive de løsest bundne elektronene fra et metall."
    section: "Repetisjon og postulater"
  - term: "Comptonbølgelengde"
    definition: "$\\lambda_C = h/m_ec = 2{,}43$ pm for elektronet. Setter skalaen for komptonforskyvningen."
    section: "Repetisjon og postulater"
  - term: "Stasjonær tilstand"
    definition: "Tilstand med skarp energi. Et atom i en stasjonær tilstand stråler ikke."
    section: "Repetisjon og postulater"
  - term: "Bølge-partikkel-dualitet"
    definition: "Lys og materie har både bølge- og partikkelegenskaper. Bølgen bestemmer sannsynlighetsfordelingen, partikkelen viser seg i hver enkelt deteksjon."
    section: "Repetisjon og postulater"
  - term: "de Broglie-bølgelengde"
    definition: "Bølgelengden $\\lambda = h/p$ knyttet til en partikkel med impuls $p$."
    section: "Repetisjon og postulater"
  - term: "Bølgefunksjon"
    definition: "Funksjonen $\\Psi$ som beskriver tilstanden til et system. $|\\Psi|^2$ gir sannsynlighetsfordelingen; $\\Psi$ selv kan ikke måles."
    section: "Repetisjon og postulater"
  - term: "Bohrradius"
    definition: "$a_0 = 4\\pi\\varepsilon_0\\hbar^2/m_ee^2 = 0{,}529$ Å. Lengdeskalaen for hydrogenatomet."
    section: "Repetisjon og postulater"
  - term: "Finstrukturkonstanten"
    definition: "$\\alpha = e^2/4\\pi\\varepsilon_0\\hbar c \\approx 1/137$. Dimensjonsløs; angir styrken på den elektromagnetiske vekselvirkningen."
    section: "Repetisjon og postulater"

  - term: "Observabel"
    definition: "Målbar fysisk størrelse. Representeres i teorien av en lineær operator."
    section: "Repetisjon og postulater"
  - term: "Forventningsverdi"
    definition: "Gjennomsnittet måleverdiene nærmer seg når observabelen måles mange ganger på et ensemble preparert i samme tilstand."
    section: "Repetisjon og postulater"
  - term: "Degenerasjon"
    definition: "At en egenverdi har flere lineært uavhengige egenfunksjoner. Antallet $g_n$ er degenerasjonsgraden."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Kollaps"
    definition: "Målingen fjerner den delen av bølgefunksjonen som ikke er forenlig med måleresultatet."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Bevegelseskonstant"
    definition: "Størrelse med tidsuavhengig forventningsverdi: en tidsuavhengig operator som kommuterer med $\\hat H$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Impulsrommet"
    definition: "Formuleringen der $\\Phi(p, t)$ er bølgefunksjonen. Der er $\\hat p = p$ og $\\hat x = -(\\hbar/i)\\,\\partial/\\partial p$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Ehrenfests teorem"
    definition: "Forventningsverdiene følger likninger med samme form som Newtons: $d\\langle x \\rangle/dt = \\langle p \\rangle/m$ og $d\\langle p \\rangle/dt = -\\langle V'(x) \\rangle$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Egenrom"
    definition: "Alle egenfunksjoner som hører til samme egenverdi $f_n$. Dimensjonen er degenerasjonsgraden $g_n$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Kompatible observable"
    definition: "Observable med kommuterende operatorer. De har felles egenfunksjoner og kan ha skarpe verdier samtidig."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Deltafunksjonsnormering"
    definition: "Normering av egenfunksjoner med kontinuerlig spektrum: $\\int \\psi_{f'}^*\\psi_f\\,d\\tau = \\delta(f - f')$ i stedet for $\\delta_{nn'}$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Tilstandsvektor"
    definition: "Vektoren $|\\psi\\rangle$ i Hilbertrommet som beskriver tilstanden. Bølgefunksjonen $\\psi(x) = \\langle x|\\psi\\rangle$ er komponentene dens i posisjonsbasisen."
    section: "Diracnotasjon og representasjoner"
  - term: "Hilbertrom"
    definition: "Komplekst, lineært vektorrom med skalarprodukt. For bølgefunksjoner er det de kvadratisk integrerbare funksjonene, $L^2$."
    section: "Diracnotasjon og representasjoner"
  - term: "Bra og ket"
    definition: "Ketvektoren $|a\\rangle$ er en tilstandsvektor, bravektoren $\\langle a|$ den duale vektoren. Sammen gir de skalarproduktet $\\langle a|b\\rangle$."
    section: "Diracnotasjon og representasjoner"
  - term: "Fullstendighetsrelasjonen"
    definition: "$\\sum_n |n\\rangle\\langle n| = \\mathbb{1}$ for et ortonormert basissett. Settes inn i et uttrykk for å bytte basis."
    section: "Diracnotasjon og representasjoner"
  - term: "Projeksjonsoperator"
    definition: "$\\hat P_n = |n\\rangle\\langle n|$. Plukker ut den delen av en vektor som peker langs $|n\\rangle$. Hermitesk, med $\\hat P_n^2 = \\hat P_n$."
    section: "Diracnotasjon og representasjoner"
  - term: "Adjungert operator"
    definition: "$\\hat A^\\dagger$, definert ved $\\langle a|\\hat A^\\dagger|b\\rangle = \\langle b|\\hat A|a\\rangle^*$. Den duale vektoren til $\\hat A|a\\rangle$ er $\\langle a|\\hat A^\\dagger$."
    section: "Diracnotasjon og representasjoner"
  - term: "Hermitesk operator"
    definition: "Operator med $\\hat A^\\dagger = \\hat A$. Har reelle egenverdier og reelle forventningsverdier, og observable svarer til hermiteske operatorer."
    section: "Diracnotasjon og representasjoner"
  - term: "Spektrum"
    definition: "Mengden av egenverdier til en operator. Kan være diskret, kontinuerlig eller begge deler."
    section: "Diracnotasjon og representasjoner"
  - term: "Representasjon"
    definition: "Den generelle formuleringen projisert på en bestemt basis. Posisjonsbasisen gir bølgemekanikk i $x$, impulsbasisen gir impulsrommet, og en diskret basis gir matrisemekanikk."
    section: "Diracnotasjon og representasjoner"
  - term: "Posisjonsrepresentasjonen"
    definition: "Kvantemekanikken med egenvektorene $|x'\\rangle$ til $\\hat x$ som basis. Der er $\\psi(x) = \\langle x|\\psi\\rangle$ bølgefunksjonen og $(\\hbar/i)\\,\\partial/\\partial x$ impulsoperatoren."
    section: "Diracnotasjon og representasjoner"
  - term: "Matrisemekanikk"
    definition: "Kvantemekanikken i en diskret basis: tilstander er kolonnematriser $a_k = \\langle k|a\\rangle$ og operatorer er matriser $A_{kn} = \\langle k|\\hat A|n\\rangle$."
    section: "Diracnotasjon og representasjoner"
