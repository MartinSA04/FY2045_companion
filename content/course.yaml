# ── Formelsamling ────────────────────────────────────────────────────────────
# Hvilke formler som står på årets vedlegg til eksamen er ikke verifisert, så
# ingen rader gjør onSheet/memorize-krav.
formulas:
  - id: planck-stralingslov
    tex: "u(\\nu, T) = \\dfrac{8\\pi\\nu^2}{c^3}\\,\\dfrac{h\\nu}{e^{h\\nu/k_BT} - 1}"
    label: "Plancks strålingslov: spektral energitetthet i et hulrom med temperatur $T$."
    section: "Repetisjon og postulater"
  - id: fotoelektrisk-likning
    tex: "E_{\\text{kin}} = h\\nu - W"
    label: "Einsteins fotoelektriske likning. $W$ er frigjøringsarbeidet for metallet."
    section: "Repetisjon og postulater"
  - id: foton-energi-impuls
    tex: "E_\\gamma = h\\nu, \\qquad p_\\gamma = \\dfrac{E_\\gamma}{c} = \\dfrac{h}{\\lambda}"
    label: "Fotonets energi og impuls."
    section: "Repetisjon og postulater"
  - id: compton-relasjonen
    tex: "\\lambda' - \\lambda = \\dfrac{h}{m_e c}\\,(1 - \\cos\\theta)"
    label: "Compton-relasjonen for spredning av et foton på et fritt elektron."
    section: "Repetisjon og postulater"
  - id: bohr-energier
    tex: "E_n = -\\dfrac{hcR_\\infty}{n^2} \\approx -\\dfrac{13{,}6\\ \\text{eV}}{n^2}"
    label: "Energinivåene i hydrogen, $n = 1, 2, 3, \\dots$"
    section: "Repetisjon og postulater"
  - id: de-broglie-relasjonene
    tex: "\\lambda = \\dfrac{h}{p}, \\qquad \\nu = \\dfrac{E}{h}"
    label: "de Broglie-relasjonene: bølgelengde og frekvens for en partikkel."
    section: "Repetisjon og postulater"

  - id: schrodingerlikningen
    tex: "i\\hbar\\,\\dfrac{\\partial\\Psi}{\\partial t} = \\hat H\\,\\Psi"
    label: "Schrödingerlikningen: kvantemekanikkens bevegelseslikning."
    section: "Repetisjon og postulater"
  - id: forventningsverdi
    tex: "\\langle F \\rangle_\\Psi = \\int \\Psi^* \\hat F\\, \\Psi\\, d\\tau"
    label: "Forventningsverdien av observabelen $F$ i tilstanden $\\Psi$."
    section: "Repetisjon og postulater"
  - id: sannsynlighet-degenerert
    tex: "P_n = \\sum_{i=1}^{g_n} |c_{ni}|^2"
    label: "Sannsynligheten for å måle en degenerert egenverdi $f_n$ med degenerasjonsgrad $g_n$."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: tidsutvikling-forventningsverdi
    tex: "\\dfrac{d}{dt}\\langle F \\rangle = \\dfrac{i}{\\hbar}\\,\\bigl\\langle [\\hat H, \\hat F] \\bigr\\rangle + \\Bigl\\langle \\dfrac{\\partial \\hat F}{\\partial t} \\Bigr\\rangle"
    label: "Tidsutviklingen til en forventningsverdi. Kommuterer en tidsuavhengig $\\hat F$ med $\\hat H$, er $F$ en bevegelseskonstant."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: impuls-egenfunksjoner
    tex: "\\psi_p(x) = (2\\pi\\hbar)^{-1/2}\\, e^{ipx/\\hbar}"
    label: "Impulsegenfunksjonene, deltafunksjonsnormerte."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: impulsrom-bolgefunksjon
    tex: "\\Phi(p, t) = \\int_{-\\infty}^{\\infty} \\psi_p^*(x)\\, \\Psi(x, t)\\, dx"
    label: "Bølgefunksjonen i impulsrommet. $|\\Phi(p, t)|^2$ er sannsynlighetstettheten for impulsen."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: ehrenfests-teorem
    tex: "\\begin{aligned} \\dfrac{d\\langle x \\rangle}{dt} &= \\dfrac{\\langle p \\rangle}{m}, \\\\[4pt] \\dfrac{d\\langle p \\rangle}{dt} &= -\\langle V'(x) \\rangle \\end{aligned}"
    label: "Ehrenfests teorem: bevegelseslikningene for $\\langle x \\rangle$ og $\\langle p \\rangle$ når $\\hat H = \\hat p^2/2m + V(x)$."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: delta-normering
    tex: "\\int \\psi_{p'}^*\\,\\psi_p\\,dx = \\delta(p - p')"
    label: "Deltafunksjonsnormering av egenfunksjoner med kontinuerlig spektrum."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: impulsrom-operatorer
    tex: "\\hat p = p, \\qquad \\hat x = -\\dfrac{\\hbar}{i}\\,\\dfrac{\\partial}{\\partial p}"
    label: "Operatorene i impulsrommet. $\\Phi(p, t)$ følger Schrödingerlikningen med samme $\\hat H$."
    section: "Tidsutvikling, måling og impulsrommet"
  - id: skalarprodukt-dirac
    tex: "\\begin{aligned} \\langle a|b\\rangle &= \\langle b|a\\rangle^*, \\\\[2pt] c\\,|a\\rangle &\\;\\leftrightarrow\\; c^*\\langle a| \\end{aligned}"
    label: "Skalarproduktet i Diracnotasjon, og den duale vektoren til $c\\,|a\\rangle$."
    section: "Diracnotasjon og representasjoner"
  - id: komponenter-tre-basiser
    tex: "\\begin{aligned} \\psi(x) &= \\langle x|\\psi\\rangle, \\\\[2pt] \\Phi(p) &= \\langle p|\\psi\\rangle, \\\\[2pt] c_n &= \\langle n|\\psi\\rangle \\end{aligned}"
    label: "Bølgefunksjonene og utviklingskoeffisientene er komponentene til $|\\psi\\rangle$ i tre basiser."
    section: "Diracnotasjon og representasjoner"
  - id: fullstendighetsrelasjonen
    tex: "\\begin{aligned} \\sum_n |n\\rangle\\langle n| &= \\mathbb{1}, \\\\[2pt] \\int dx\\,|x\\rangle\\langle x| &= \\mathbb{1} \\end{aligned}"
    label: "Fullstendighetsrelasjonen for en diskret og en kontinuerlig basis. Settes inn for å bytte basis."
    section: "Diracnotasjon og representasjoner"
  - id: adjungert-operator
    tex: "\\begin{aligned} \\langle a|\\hat A^\\dagger|b\\rangle &= \\langle b|\\hat A|a\\rangle^*, \\\\[2pt] (\\hat A\\hat B)^\\dagger &= \\hat B^\\dagger\\hat A^\\dagger \\end{aligned}"
    label: "Den adjungerte operatoren og produktregelen. En hermitesk operator har $\\hat A^\\dagger = \\hat A$."
    section: "Diracnotasjon og representasjoner"
  - id: spektralrepresentasjon
    tex: "\\begin{aligned} \\hat F &= \\sum_n |f_n\\rangle f_n\\langle f_n| \\\\[2pt] \\hat F &= \\int df\\,|f\\rangle f\\langle f| \\end{aligned}"
    label: "Spektralrepresentasjonen av en operator, for diskret spektrum $f_n$ (øverst) og kontinuerlig spektrum $f$ (nederst)."
    section: "Diracnotasjon og representasjoner"
  - id: forventningsverdi-dirac
    tex: "\\begin{aligned} \\langle F\\rangle &= \\langle\\Psi|\\hat F|\\Psi\\rangle \\\\[2pt] &= \\sum_n f_n\\,|\\langle f_n|\\Psi\\rangle|^2 \\end{aligned}"
    label: "Forventningsverdien i generell formulering. $|\\langle f_n|\\Psi\\rangle|^2$ er sannsynligheten for $f_n$."
    section: "Diracnotasjon og representasjoner"
  - id: schrodinger-generell
    tex: "i\\hbar\\,\\dfrac{d}{dt}|\\Psi, t\\rangle = \\hat H\\,|\\Psi, t\\rangle"
    label: "Schrödingerlikningen for tilstandsvektoren. Projisert på $\\langle x|$ gir den bølgelikningen."
    section: "Diracnotasjon og representasjoner"
  - id: impuls-matriseelement
    tex: "\\langle x''|\\hat p|x'\\rangle = \\dfrac{\\hbar}{i}\\,\\dfrac{\\partial}{\\partial x''}\\,\\delta(x'' - x')"
    label: "Matriseelementet til impulsoperatoren i posisjonsbasisen, utledet fra $[\\hat x, \\hat p] = i\\hbar$."
    section: "Diracnotasjon og representasjoner"
  - id: overlapp-x-p
    tex: "\\langle x|p\\rangle = \\dfrac{1}{\\sqrt{2\\pi\\hbar}}\\,e^{ipx/\\hbar}"
    label: "Overlappet mellom posisjons- og impulsbasisen. Gir $\\Psi(x) = \\int dp\\,\\langle x|p\\rangle\\,\\Phi(p)$."
    section: "Diracnotasjon og representasjoner"

  - id: stigeoperatorene
    tex: "\\begin{aligned} a &= \\dfrac{i\\hat p + m\\omega\\hat x}{\\sqrt{2\\hbar m\\omega}}, \\\\[4pt] a^\\dagger &= \\dfrac{-i\\hat p + m\\omega\\hat x}{\\sqrt{2\\hbar m\\omega}} \\end{aligned}"
    label: "Stigeoperatorene: $a$ senker og $a^\\dagger$ hever energien ett trinn $\\hbar\\omega$. De er hverandres adjungerte."
    section: "Harmonisk oscillator"
  - id: oscillator-hamilton
    tex: "\\begin{aligned} \\bigl[a, a^\\dagger\\bigr] &= 1, \\\\[2pt] \\hat H &= \\hbar\\omega\\bigl(\\hat N + \\tfrac12\\bigr) \\end{aligned}"
    label: "Kommutatoren og Hamiltonoperatoren uttrykt med talloperatoren $\\hat N = a^\\dagger a$."
    section: "Harmonisk oscillator"
  - id: oscillator-energiene
    tex: "E_n = \\hbar\\omega\\bigl(n + \\tfrac12\\bigr)"
    label: "Energinivåene, $n = 0, 1, 2, \\dots$ Ikke-degenererte, med nullpunktsenergien $E_0 = \\tfrac12\\hbar\\omega$."
    section: "Harmonisk oscillator"
  - id: virkningen-av-stigeoperatorene
    tex: "\\begin{aligned} a\\,|n\\rangle &= \\sqrt{n}\\,|n - 1\\rangle, \\\\[2pt] a^\\dagger|n\\rangle &= \\sqrt{n + 1}\\,|n + 1\\rangle \\end{aligned}"
    label: "Virkningen på egentilstandene. $a|0\\rangle = 0$, og $|n\\rangle = (n!)^{-1/2}(a^\\dagger)^n|0\\rangle$."
    section: "Harmonisk oscillator"
  - id: x-og-p-ved-stigeoperatorene
    tex: "\\begin{aligned} \\hat x &= \\sqrt{\\dfrac{\\hbar}{2m\\omega}}\\,(a + a^\\dagger), \\\\[4pt] \\hat p &= i\\sqrt{\\dfrac{m\\hbar\\omega}{2}}\\,(a^\\dagger - a) \\end{aligned}"
    label: "Posisjon og impuls uttrykt med stigeoperatorene. Begge kopler bare nabonivåer."
    section: "Harmonisk oscillator"
  - id: oscillator-grunntilstanden
    tex: "\\psi_0(x) = \\Bigl(\\dfrac{m\\omega}{\\pi\\hbar}\\Bigr)^{1/4} e^{-m\\omega x^2/2\\hbar}"
    label: "Grunntilstanden, løsningen av $a|0\\rangle = 0$ i posisjonsbasisen."
    section: "Harmonisk oscillator"
  - id: oscillator-egenfunksjonene
    tex: "\\begin{aligned} \\psi_n(x) &= \\Bigl(\\dfrac{m\\omega}{\\pi\\hbar}\\Bigr)^{1/4} \\dfrac{H_n(\\xi)\\,e^{-\\xi^2/2}}{\\sqrt{2^n n!}} \\\\[4pt] \\xi &= \\sqrt{m\\omega/\\hbar}\\;x \\end{aligned}"
    label: "Egenfunksjonene. $H_n$ er Hermitepolynomene."
    section: "Harmonisk oscillator"
  - id: koherent-tilstand
    tex: "\\begin{aligned} a\\,|\\alpha\\rangle &= \\alpha\\,|\\alpha\\rangle, \\\\[2pt] |\\alpha\\rangle &= e^{-|\\alpha|^2/2} \\sum_{n=0}^{\\infty} \\dfrac{\\alpha^n}{\\sqrt{n!}}\\,|n\\rangle \\end{aligned}"
    label: "Den koherente tilstanden: egentilstand av senkeoperatoren, med kompleks egenverdi $\\alpha$."
    section: "Harmonisk oscillator"
  - id: koherent-bevegelse
    tex: "\\langle x \\rangle = \\sqrt{\\dfrac{2\\hbar}{m\\omega}}\\,|\\alpha|\\,\\cos(\\omega t - \\theta)"
    label: "Bevegelsen til en koherent tilstand, med $\\alpha = |\\alpha|e^{i\\theta}$. Pakken beholder grunntilstandens form og bredde."
    section: "Harmonisk oscillator"
  - id: tidsutviklingsoperatoren
    tex: "\\hat U(t, t_0) = e^{-i(t - t_0)\\hat H/\\hbar}, \\allowbreak\\quad |\\Psi, t\\rangle = \\hat U(t, t_0)\\,|\\Psi, t_0\\rangle"
    label: "Tidsutviklingsoperatoren, når $\\hat H$ ikke avhenger eksplisitt av tida. Den er unitær, $\\hat U^\\dagger = \\hat U^{-1}$."
    section: "Harmonisk oscillator"
  - id: heisenbergbildet
    tex: "\\hat F_H(t) = \\hat U^\\dagger\\hat F\\,\\hat U, \\allowbreak\\quad \\dfrac{d\\hat F_H}{dt} = \\dfrac{i}{\\hbar}\\,\\bigl[\\hat H, \\hat F_H\\bigr]"
    label: "Heisenbergbildet: operatoren utvikler seg i tid og tilstanden står fast. For oscillatoren er $a_H(t) = e^{-i\\omega t}a$."
    section: "Harmonisk oscillator"

  - id: dreieimpuls-kommutatorer
    tex: "[J_i, J_j] = i\\hbar\\sum_k \\varepsilon_{ijk}J_k, \\allowbreak\\quad [J^2, J_i] = 0"
    label: "Definisjonen av en dreieimpuls. $\\varepsilon_{ijk}$ er Levi-Civita-symbolet."
    section: "Dreieimpuls"
  - id: dreieimpuls-stigeoperatorer
    tex: "J_\\pm = J_x \\pm iJ_y, \\allowbreak\\quad [J_z, J_\\pm] = \\pm\\hbar J_\\pm"
    label: "Heve- og senkeoperatoren. De kommuterer med $J^2$, og $J_+^\\dagger = J_-$."
    section: "Dreieimpuls"
  - id: jminus-jpluss
    tex: "J_\\mp J_\\pm = J^2 - J_z^2 \\mp \\hbar J_z"
    label: "Produktet av senke- og heveoperatoren. Gir normen til $J_\\pm|j,m\\rangle$."
    section: "Dreieimpuls"
  - id: dreieimpuls-egenverdier
    tex: "J^2|j, m\\rangle = \\hbar^2 j(j + 1)\\,|j, m\\rangle, \\allowbreak\\quad J_z|j, m\\rangle = \\hbar m\\,|j, m\\rangle"
    label: "Egenverdiene, med $j = 0, \\tfrac12, 1, \\tfrac32, \\dots$ og $m = -j, -j + 1, \\dots, j$."
    section: "Dreieimpuls"
  - id: virkningen-av-jpm
    tex: "J_\\pm|j, m\\rangle = \\hbar\\sqrt{j(j + 1) - m(m \\pm 1)}\\;|j, m \\pm 1\\rangle"
    label: "Virkningen av heve- og senkeoperatoren. Null for $m = j$ oppover og for $m = -j$ nedover."
    section: "Dreieimpuls"
  - id: banedreieimpuls-kulekoordinater
    tex: "L_z = \\dfrac{\\hbar}{i}\\dfrac{\\partial}{\\partial\\varphi}, \\allowbreak\\quad L^2 = -\\hbar^2\\Bigl(\\dfrac{\\partial^2}{\\partial\\theta^2} + \\cot\\theta\\,\\dfrac{\\partial}{\\partial\\theta} + \\dfrac{1}{\\sin^2\\theta}\\dfrac{\\partial^2}{\\partial\\varphi^2}\\Bigr)"
    label: "Banedreieimpulsen i kulekoordinater."
    section: "Dreieimpuls"
  - id: l-pluss-minus-kulekoordinater
    tex: "L_\\pm = \\hbar\\,e^{\\pm i\\varphi}\\Bigl(\\pm\\dfrac{\\partial}{\\partial\\theta} + i\\cot\\theta\\,\\dfrac{\\partial}{\\partial\\varphi}\\Bigr)"
    label: "Heve- og senkeoperatoren for banedreieimpulsen i kulekoordinater."
    section: "Dreieimpuls"
  - id: kuleflatefunksjoner
    tex: "\\psi_{lm}(r, \\theta, \\varphi) = R(r)\\,Y_{lm}(\\theta, \\varphi), \\allowbreak\\quad Y_{lm} = \\Theta_{lm}(\\theta)\\,e^{im\\varphi}"
    label: "Felles egenfunksjoner for $L^2$ og $L_z$. Kuleflatefunksjonene $Y_{lm}$ er ortonormerte på kuleflaten, og $l$ og $m$ er heltall."
    section: "Dreieimpuls"
  - id: radiallikningen
    tex: "-\\dfrac{\\hbar^2}{2m}\\dfrac{d^2u}{dr^2} \\allowbreak + \\Bigl[V(r) + \\dfrac{\\hbar^2 l(l + 1)}{2mr^2}\\Bigr]u \\allowbreak = Eu"
    label: "Radiallikningen for $u(r) = rR(r)$ i et sentralsymmetrisk potensial. Kvantetallet $m$ inngår ikke."
    section: "Dreieimpuls"

  - id: magnetisk-moment
    tex: "\\vec\\mu_L = \\dfrac{q}{2m}\\,\\vec L = \\gamma\\vec L, \\allowbreak\\quad H = -\\vec\\mu\\cdot\\vec B"
    label: "Det magnetiske momentet til en ladning $q$ i bane, og energien i et magnetfelt. $\\gamma$ er det gyromagnetiske forholdet."
    section: "Spinn"
  - id: larmor-presesjon
    tex: "\\dfrac{d\\vec L}{dt} = \\vec\\omega_L\\times\\vec L, \\allowbreak\\quad \\vec\\omega_L = -\\gamma\\vec B"
    label: "Larmor-presesjon i et homogent felt. Spinnretningen følger samme likning, med $\\gamma_e$ i stedet for $\\gamma$."
    section: "Spinn"
  - id: stern-gerlach-kraft
    tex: "\\vec F = \\nabla(\\vec\\mu\\cdot\\vec B), \\allowbreak\\quad F_z = -a\\mu_z"
    label: "Kraften på et magnetisk moment i et inhomogent felt. $F_z = -a\\mu_z$ gjelder Stern–Gerlach-feltet $\\vec B = ax\\,\\hat x - (B_0 + az)\\,\\hat z$."
    section: "Spinn"
  - id: bohr-magneton
    tex: "\\mu_B = \\dfrac{e\\hbar}{2m_e} = 5{,}79\\cdot10^{-5}\\ \\text{eV/T}"
    label: "Bohr-magnetonet. For banedreieimpulsen til elektronet er $(\\mu_L)_z = -\\mu_B m$."
    section: "Spinn"
  - id: elektronspinn-moment
    tex: "\\vec\\mu_s = -g_e\\dfrac{e}{2m_e}\\,\\vec S = \\gamma_e\\vec S, \\allowbreak\\quad g_e = 2{,}0023"
    label: "Det magnetiske momentet til elektronspinnet. Det peker motsatt av $\\vec S$."
    section: "Spinn"
  - id: paulimatrisene
    tex: "\\vec S = \\dfrac{\\hbar}{2}\\,\\vec\\sigma, \\allowbreak\\quad \\sigma_x = \\begin{pmatrix} 0 & 1 \\\\ 1 & 0 \\end{pmatrix}, \\allowbreak\\quad \\sigma_y = \\begin{pmatrix} 0 & -i \\\\ i & 0 \\end{pmatrix}, \\allowbreak\\quad \\sigma_z = \\begin{pmatrix} 1 & 0 \\\\ 0 & -1 \\end{pmatrix}"
    label: "Spinnoperatoren for spinn ½ i basisen $\\{|{\\uparrow}\\rangle, |{\\downarrow}\\rangle\\}$."
    section: "Spinn"
  - id: pauli-produkt
    tex: "\\sigma_i\\sigma_j = \\delta_{ij}\\,\\mathbb{1} + i\\sum_k\\varepsilon_{ijk}\\,\\sigma_k"
    label: "Produktet av to Paulimatriser. Gir $\\sigma_i^2 = \\mathbb{1}$, $[\\sigma_i, \\sigma_j] = 2i\\sum_k\\varepsilon_{ijk}\\sigma_k$ og $\\{\\sigma_i, \\sigma_j\\} = 2\\delta_{ij}\\mathbb{1}$."
    section: "Spinn"
  - id: spinor
    tex: "\\chi = \\begin{pmatrix} a_+ \\\\ a_- \\end{pmatrix} = a_+\\chi_+ + a_-\\chi_-, \\allowbreak\\quad |a_+|^2 + |a_-|^2 = 1"
    label: "En spinor. $|a_\\pm|^2$ er sannsynlighetene for $S_z = \\pm\\hbar/2$."
    section: "Spinn"
  - id: spinnretningen
    tex: "\\langle S_x\\rangle + i\\langle S_y\\rangle = \\hbar\\,a_+^*a_-, \\allowbreak\\quad \\langle S_z\\rangle = \\tfrac{\\hbar}{2}\\bigl(|a_+|^2 - |a_-|^2\\bigr)"
    label: "Spinnretningen $\\langle\\vec S\\rangle = \\chi^\\dagger\\vec S\\chi$. For spinn ½ er lengden alltid $\\hbar/2$."
    section: "Spinn"
  - id: egenspinorer-x-y
    tex: "\\chi_\\pm^{(x)} = \\dfrac{1}{\\sqrt2}\\begin{pmatrix} 1 \\\\ \\pm 1 \\end{pmatrix}, \\allowbreak\\quad \\chi_\\pm^{(y)} = \\dfrac{1}{\\sqrt2}\\begin{pmatrix} 1 \\\\ \\pm i \\end{pmatrix}"
    label: "Egenspinorene til $S_x$ og $S_y$ med egenverdiene $\\pm\\hbar/2$. Sannsynligheten for $S_x = \\pm\\hbar/2$ er $\\tfrac12|a_+ \\pm a_-|^2$."
    section: "Spinn"
  - id: spinn-langs-n
    tex: "\\chi_+^{(n)} = \\begin{pmatrix} \\cos\\frac\\theta2 \\\\ e^{i\\varphi}\\sin\\frac\\theta2 \\end{pmatrix}, \\allowbreak\\quad \\langle\\vec S\\rangle = \\dfrac{\\hbar}{2}\\,\\hat n"
    label: "Spinn opp langs $\\hat n = (\\sin\\theta\\cos\\varphi, \\sin\\theta\\sin\\varphi, \\cos\\theta)$. Måles $S_z$, er sannsynligheten for $+\\hbar/2$ lik $\\cos^2(\\theta/2)$."
    section: "Spinn"
  - id: spinn-i-magnetfelt
    tex: "\\hat H = \\omega_L S_z, \\allowbreak\\quad \\omega_L = \\dfrac{g_e eB_0}{2m_e}, \\allowbreak\\quad \\chi(t) = \\begin{pmatrix} a_+e^{-i\\omega_L t/2} \\\\ a_-e^{i\\omega_L t/2} \\end{pmatrix}"
    label: "Et elektron i feltet $B_0\\hat z$. Spinnretningen preseserer rundt feltet med vinkelfrekvensen $\\omega_L$."
    section: "Spinn"

# ── Symboler ─────────────────────────────────────────────────────────────────
# Én rad per betydning. Der en bokstav betyr to ting (m, n, α, θ, F, a), sier
# notatet hvilken den andre er.
symbols:
  # ── Lyskvantene og Bohr-modellen ──
  - { tex: "\\nu", meaning: "Frekvensen", unit: "Hz", section: "Lyskvantene og Bohr-modellen", formula: foton-energi-impuls, note: "Fotonet har energien $h\\nu$. For en partikkel er $\\nu = E/h$." }
  - { tex: "\\lambda", meaning: "Bølgelengden", unit: "m", section: "Lyskvantene og Bohr-modellen", term: "de Broglie-bølgelengde", formula: de-broglie-relasjonene, note: "For en partikkel med impuls $p$ er $\\lambda = h/p$." }
  - { tex: "W", meaning: "Frigjøringsarbeidet for metallet", unit: "eV", section: "Lyskvantene og Bohr-modellen", term: "Frigjøringsarbeid", formula: fotoelektrisk-likning }
  - { tex: "\\theta", meaning: "Spredningsvinkelen i Compton-relasjonen", section: "Lyskvantene og Bohr-modellen", formula: compton-relasjonen, note: "Ikke polarvinkelen $\\theta$ i kulekoordinater." }
  - { tex: "\\lambda_C", meaning: "Comptonbølgelengden, $h/m_ec$", unit: "pm", section: "Lyskvantene og Bohr-modellen", term: "Comptonbølgelengde", formula: compton-relasjonen, note: "$2{,}43$ pm for elektronet." }
  - { tex: "u(\\nu, T)", meaning: "Spektral energitetthet i et hulrom med temperatur $T$", unit: "J·s/m³", section: "Lyskvantene og Bohr-modellen", formula: planck-stralingslov, note: "Ikke $u(r) = rR(r)$ i radiallikningen." }
  - { tex: "R_\\infty", meaning: "Rydbergkonstanten", unit: "m⁻¹", section: "Lyskvantene og Bohr-modellen", formula: bohr-energier, note: "I Balmers formel $1/\\lambda = R_\\infty(1/n^2 - 1/m^2)$ er $n$ og $m$ heltall med $m > n$." }
  # ── Postulatene, måling og impulsrommet ──
  - { tex: "\\Psi(x, t)", meaning: "Bølgefunksjonen som funksjon av posisjon og tid", section: "Postulatene, måling og impulsrommet", term: "Bølgefunksjon", formula: schrodingerlikningen, id: bolgefunksjonen, note: "$|\\Psi|^2$ er sannsynlighetstettheten. $\\Psi$ selv kan ikke måles." }
  - { tex: "\\psi(x),\\allowbreak\\ \\psi_n(x)", meaning: "Bølgefunksjonen når tida ikke er skrevet ut, og egenfunksjonen med indeks $n$", section: "Postulatene, måling og impulsrommet", formula: komponenter-tre-basiser, note: "$\\psi(x) = \\langle x|\\psi\\rangle$ og $\\psi_n(x) = \\langle x|n\\rangle$." }
  - { tex: "m", meaning: "Massen til partikkelen", unit: "kg", section: "Postulatene, måling og impulsrommet", id: masse, note: "Ikke kvantetallet $m$ til $J_z$. I $\\langle m|\\hat x|n\\rangle$ er $m$ et nivå, og massen står i samme formel." }
  - { tex: "F,\\ \\hat F", meaning: "En observabel og operatoren som svarer til den", section: "Postulatene, måling og impulsrommet", term: "Observabel", formula: forventningsverdi, note: "Ved Ehrenfests teorem er $F(x) = -V'(x)$ kraften." }
  - { tex: "f_n", meaning: "Egenverdiene til $\\hat F$, de mulige måleverdiene", section: "Postulatene, måling og impulsrommet", term: "Spektrum", formula: spektralrepresentasjon, note: "Skrives $f$ uten indeks når spekteret er kontinuerlig." }
  - { tex: "c_n", meaning: "Utviklingskoeffisienten, $c_n = \\langle n|\\psi\\rangle$", section: "Postulatene, måling og impulsrommet", formula: komponenter-tre-basiser, note: "$|c_n|^2$ er sannsynligheten for $f_n$. Ved degenerasjon $c_{ni}$ med $i = 1, \\dots, g_n$." }
  - { tex: "\\langle F\\rangle", meaning: "Forventningsverdien av $F$", section: "Postulatene, måling og impulsrommet", term: "Forventningsverdi", formula: forventningsverdi, note: "I Diracnotasjon $\\langle\\Psi|\\hat F|\\Psi\\rangle$." }
  - { tex: "d\\tau", meaning: "Volumelementet i integralet over alle koordinatene", section: "Postulatene, måling og impulsrommet", formula: forventningsverdi, note: "$dx$ i én dimensjon." }
  - { tex: "\\hat H", meaning: "Hamiltonoperatoren", section: "Postulatene, måling og impulsrommet", formula: schrodingerlikningen, note: "$\\hat p^2/2m + V$. Ikke Hermitepolynomet $H_n$." }
  - { tex: "V", meaning: "Potensiell energi, $V(x)$ eller $V(r)$", unit: "J", section: "Postulatene, måling og impulsrommet", formula: ehrenfests-teorem, note: "I et sentralsymmetrisk potensial avhenger $V$ bare av $r$." }
  - { tex: "[\\hat A, \\hat B]", meaning: "Kommutatoren $\\hat A\\hat B - \\hat B\\hat A$", section: "Postulatene, måling og impulsrommet", formula: tidsutvikling-forventningsverdi, id: kommutator, note: "Er den null, har operatorene felles egenfunksjoner." }
  - { tex: "g_n", meaning: "Degenerasjonsgraden til egenverdien $f_n$", section: "Postulatene, måling og impulsrommet", term: "Degenerasjon", formula: sannsynlighet-degenerert }
  - { tex: "P_n", meaning: "Sannsynligheten for å måle $f_n$", section: "Postulatene, måling og impulsrommet", formula: sannsynlighet-degenerert, note: "Ikke projeksjonsoperatoren $\\hat P_n$." }
  - { tex: "\\hat x,\\ \\hat p", meaning: "Posisjons- og impulsoperatoren", section: "Postulatene, måling og impulsrommet", formula: impulsrom-operatorer, note: "$[\\hat x, \\hat p] = i\\hbar$. I posisjonsrommet er $\\hat p = (\\hbar/i)\\,\\partial/\\partial x$, i impulsrommet $\\hat x = -(\\hbar/i)\\,\\partial/\\partial p$." }
  - { tex: "\\Delta x,\\allowbreak\\ \\Delta p", meaning: "Uskarpheten i posisjon og impuls", section: "Postulatene, måling og impulsrommet", note: "$(\\Delta x)^2 = \\langle x^2\\rangle - \\langle x\\rangle^2$. Produktet er minst $\\hbar/2$, og grunntilstanden i oscillatoren når grensen." }
  - { tex: "\\psi_p(x)", meaning: "Impulsegenfunksjonen, en plan bølge med impuls $p$", section: "Postulatene, måling og impulsrommet", formula: impuls-egenfunksjoner, note: "Deltafunksjonsnormert: $\\int\\psi_{p'}^*\\psi_p\\,dx = \\delta(p - p')$." }
  - { tex: "\\Phi(p, t)", meaning: "Bølgefunksjonen i impulsrommet", section: "Postulatene, måling og impulsrommet", term: "Impulsrommet", formula: impulsrom-bolgefunksjon, id: phi, note: "$|\\Phi|^2$ er sannsynlighetstettheten for impulsen. Eksamensoppgaver skriver også $\\phi(p)$." }
  - { tex: "\\delta(x),\\allowbreak\\ \\delta_{nn'}", meaning: "Deltafunksjonen og Kronecker-deltaet", section: "Postulatene, måling og impulsrommet", formula: delta-normering, note: "$\\delta(x - x')$ er null unntatt i $x = x'$. $\\delta_{nn'}$ er 1 for $n = n'$ og ellers 0." }
  # ── Diracnotasjon ──
  - { tex: "|\\psi\\rangle,\\allowbreak\\ |\\Psi, t\\rangle", meaning: "Tilstandsvektoren, uten og med tida skrevet ut", section: "Diracnotasjon", term: "Tilstandsvektor", formula: schrodinger-generell, id: ket }
  - { tex: "\\langle a|", meaning: "Bravektoren, den duale vektoren til $|a\\rangle$", section: "Diracnotasjon", term: "Bra og ket", formula: skalarprodukt-dirac, note: "Den duale vektoren til $c\\,|a\\rangle$ er $c^*\\langle a|$." }
  - { tex: "\\langle a|b\\rangle", meaning: "Skalarproduktet, et komplekst tall", section: "Diracnotasjon", formula: skalarprodukt-dirac, note: "Amplituden for å finne systemet i $|a\\rangle$ når det er i $|b\\rangle$. $|\\langle a|b\\rangle|^2$ er sannsynligheten." }
  - { tex: "|n\\rangle", meaning: "Energiegenvektoren med indeks $n$", section: "Diracnotasjon", formula: komponenter-tre-basiser, note: "$|n\\rangle = |\\psi_n\\rangle = |E_n\\rangle$." }
  - { tex: "|x\\rangle,\\allowbreak\\ |p\\rangle", meaning: "Egenvektorene til $\\hat x$ og $\\hat p$", section: "Diracnotasjon", formula: overlapp-x-p, note: "Deltafunksjonsnormerte og ingen fysiske tilstander. $\\langle x|\\psi\\rangle = \\psi(x)$ og $\\langle p|\\psi\\rangle = \\Phi(p)$." }
  - { tex: "\\mathbb{1}", meaning: "Enhetsoperatoren", section: "Diracnotasjon", formula: fullstendighetsrelasjonen, note: "$\\sum_n |n\\rangle\\langle n| = \\mathbb{1}$ settes inn for å bytte basis." }
  - { tex: "\\hat A^\\dagger", meaning: "Den adjungerte operatoren til $\\hat A$", section: "Diracnotasjon", term: "Adjungert operator", formula: adjungert-operator, note: "Operatoren er hermitesk når $\\hat A^\\dagger = \\hat A$." }
  - { tex: "\\hat P_n", meaning: "Projeksjonsoperatoren $|n\\rangle\\langle n|$", section: "Diracnotasjon", term: "Projeksjonsoperator", note: "Ikke sannsynligheten $P_n$." }
  # ── Harmonisk oscillator ──
  - { tex: "\\omega", meaning: "Vinkelfrekvensen til oscillatoren", unit: "s⁻¹", section: "Harmonisk oscillator", formula: oscillator-energiene, note: "$V = \\tfrac12 m\\omega^2x^2$. Nivåene ligger $\\hbar\\omega$ fra hverandre." }
  - { tex: "a,\\ a^\\dagger", meaning: "Senke- og heveoperatoren", section: "Harmonisk oscillator", term: "Stigeoperatorer", formula: stigeoperatorene, id: stigeoperatorer, note: "Dimensjonsløse og uten hatt; noen eksamensoppgaver skriver $\\hat a$. I utledningen av dreieimpulsspekteret er $a$ egenverdien til $J^2$." }
  - { tex: "\\hat N", meaning: "Talloperatoren $a^\\dagger a$", section: "Harmonisk oscillator", term: "Talloperator", formula: oscillator-hamilton }
  - { tex: "n", meaning: "Nivået i oscillatoren, egenverdien til $\\hat N$", section: "Harmonisk oscillator", formula: virkningen-av-stigeoperatorene, id: n-oscillator, note: "$n = 0, 1, 2, \\dots$ Ikke $n$ i hydrogen, som starter på 1. I postulatene er $n$ bare en indeks for egentilstandene." }
  - { tex: "E_n", meaning: "Energien til nivå $n$, $\\hbar\\omega(n + \\tfrac12)$", unit: "J", section: "Harmonisk oscillator", formula: oscillator-energiene, note: "$E_0 = \\tfrac12\\hbar\\omega$ er nullpunktsenergien." }
  - { tex: "H_n(\\xi)", meaning: "Hermitepolynomet av grad $n$", section: "Harmonisk oscillator", formula: oscillator-egenfunksjonene, note: "Ikke Hamiltonoperatoren $\\hat H$." }
  - { tex: "\\xi", meaning: "Dimensjonsløs posisjon, $\\sqrt{m\\omega/\\hbar}\\,x$", section: "Harmonisk oscillator", formula: oscillator-egenfunksjonene }
  - { tex: "\\alpha,\\ |\\alpha\\rangle", meaning: "Den koherente tilstanden, med $a|\\alpha\\rangle = \\alpha|\\alpha\\rangle$", section: "Harmonisk oscillator", term: "Koherent tilstand", formula: koherent-tilstand, id: alfa, note: "Kompleks, $\\alpha = |\\alpha|e^{i\\theta}$, og $\\langle n\\rangle = |\\alpha|^2$. Ikke finstrukturkonstanten $\\alpha$." }
  - { tex: "\\hat U(t, t_0)", meaning: "Tidsutviklingsoperatoren", section: "Harmonisk oscillator", term: "Tidsutviklingsoperator", formula: tidsutviklingsoperatoren, note: "Unitær: $\\hat U^\\dagger = \\hat U^{-1}$." }
  - { tex: "\\hat F_H(t)", meaning: "Operatoren $\\hat F$ i Heisenbergbildet", section: "Harmonisk oscillator", term: "Heisenbergbildet", formula: heisenbergbildet, note: "$\\hat F_H = \\hat U^\\dagger\\hat F\\hat U$. For oscillatoren er $a_H(t) = e^{-i\\omega t}a$." }
  # ── Dreieimpuls og hydrogen ──
  - { tex: "\\vec J,\\allowbreak\\ J_x,\\allowbreak\\ J_y,\\allowbreak\\ J_z", meaning: "En dreieimpuls og komponentene av den", unit: "J·s", section: "Dreieimpuls og hydrogen", term: "Dreieimpuls", formula: dreieimpuls-kommutatorer, note: "Uten hatt, som stigeoperatorene. $J^2 = J_x^2 + J_y^2 + J_z^2$." }
  - { tex: "J_\\pm", meaning: "Heve- og senkeoperatoren for dreieimpuls, $J_x \\pm iJ_y$", section: "Dreieimpuls og hydrogen", formula: dreieimpuls-stigeoperatorer, note: "Endrer $m$ med $\\pm 1$. For banedreieimpulsen skrives de $L_\\pm$." }
  - { tex: "j", meaning: "Kvantetallet til $J^2$, med egenverdien $\\hbar^2 j(j+1)$", section: "Dreieimpuls og hydrogen", formula: dreieimpuls-egenverdier, note: "$j = 0, \\tfrac12, 1, \\tfrac32, \\dots$ Halvtallige $j$ hører til spinn." }
  - { tex: "m", meaning: "Kvantetallet til $J_z$, $L_z$ og $S_z$, med egenverdien $\\hbar m$", section: "Dreieimpuls og hydrogen", formula: dreieimpuls-egenverdier, id: m-kvantetall, note: "$m = -j, \\dots, j$ i hele trinn, $2j + 1$ verdier. Ikke massen $m$." }
  - { tex: "\\varepsilon_{ijk}", meaning: "Levi-Civita-symbolet", section: "Dreieimpuls og hydrogen", formula: dreieimpuls-kommutatorer, note: "$+1$ for $xyz$ og sykliske permutasjoner, $-1$ for de andre og $0$ når to indekser er like. Ikke $\\varepsilon_0$." }
  - { tex: "\\vec L,\\allowbreak\\ L_z,\\allowbreak\\ L^2", meaning: "Banedreieimpulsen $\\vec r \\times \\vec p$", unit: "J·s", section: "Dreieimpuls og hydrogen", term: "Banedreieimpuls", formula: banedreieimpuls-kulekoordinater, note: "Uten hatt, som $\\vec J$. Eksamensoppgaver skriver $\\hat{\\mathbf L}$." }
  - { tex: "l", meaning: "Kvantetallet til $L^2$, med egenverdien $\\hbar^2 l(l+1)$", section: "Dreieimpuls og hydrogen", formula: kuleflatefunksjoner, note: "$l = 0, 1, 2, \\dots$, bare heltall. Eksamensoppgaver skriver også $\\ell$." }
  - { tex: "r,\\allowbreak\\ \\theta,\\allowbreak\\ \\varphi", meaning: "Kulekoordinatene: avstanden fra origo, polarvinkelen og asimutvinkelen", section: "Dreieimpuls og hydrogen", formula: banedreieimpuls-kulekoordinater, note: "Ikke spredningsvinkelen $\\theta$ i Compton-relasjonen eller fasen $\\theta$ til $\\alpha$." }
  - { tex: "Y_{lm}", meaning: "Kuleflatefunksjonene", section: "Dreieimpuls og hydrogen", term: "Kuleflatefunksjoner", formula: kuleflatefunksjoner, note: "$Y_{lm} = \\Theta_{lm}(\\theta)\\,e^{im\\varphi}$." }
  - { tex: "R(r),\\allowbreak\\ u(r)", meaning: "Radialfunksjonen og $u(r) = rR(r)$", section: "Dreieimpuls og hydrogen", term: "Radiallikningen", formula: radiallikningen, note: "Ikke Rydbergkonstanten $R_\\infty$ eller energitettheten $u(\\nu, T)$." }
  - { tex: "\\kappa", meaning: "Hvor raskt en bunden tilstand avtar langt ute, $\\sqrt{-2mE}/\\hbar$", unit: "m⁻¹", section: "Dreieimpuls og hydrogen", note: "$u \\propto e^{-\\kappa r}$ når $E < 0$." }
  - { tex: "n", meaning: "Hovedkvantetallet, som nummererer energinivåene i hydrogen", section: "Dreieimpuls og hydrogen", formula: bohr-energier, id: n-hydrogen, note: "$n = 1, 2, 3, \\dots$ og $l = 0, \\dots, n - 1$. Ikke nivået $n$ i oscillatoren, som starter på 0." }
  - { tex: "E_n", meaning: "Energinivåene i hydrogen", unit: "eV", section: "Dreieimpuls og hydrogen", formula: bohr-energier, note: "$-13{,}6\\ \\text{eV}/n^2$, med $n^2$ tilstander per nivå uten spinn." }
  # ── Spinn ──
  - { tex: "\\vec S,\\allowbreak\\ S_x,\\allowbreak\\ S_y,\\allowbreak\\ S_z", meaning: "Spinnet og komponentene av det", unit: "J·s", section: "Spinn", term: "Spinn", formula: paulimatrisene, note: "Uten hatt, som $\\vec J$. Eksamensoppgaver skriver $\\hat S_z$." }
  - { tex: "s", meaning: "Spinnkvantetallet, med egenverdien $\\hbar^2 s(s+1)$ for $S^2$", section: "Spinn", term: "Spinn", note: "$s = \\tfrac12$ for elektronet, protonet og nøytronet. Kvantetallet til $S_z$ er $m$, hos noen $m_s$." }
  - { tex: "|{\\uparrow}\\rangle,\\allowbreak\\ |{\\downarrow}\\rangle", meaning: "Spinn opp og spinn ned langs $z$-aksen", section: "Spinn", formula: spinor, note: "Som spinorer $\\chi_+ = (1, 0)^T$ og $\\chi_- = (0, 1)^T$." }
  - { tex: "\\chi,\\allowbreak\\ a_\\pm", meaning: "Spinoren og komponentene av den, amplitudene for $S_z = \\pm\\hbar/2$", section: "Spinn", term: "Spinor", formula: spinor, note: "Ikke senkeoperatoren $a$. I Stern–Gerlach-feltet er $a$ feltgradienten." }
  - { tex: "\\chi_\\pm^{(x)},\\allowbreak\\ \\chi_\\pm^{(y)},\\allowbreak\\ \\chi_+^{(n)}", meaning: "Egenspinorene til $S_x$, $S_y$ og $S_n = \\hat n\\cdot\\vec S$", section: "Spinn", formula: egenspinorer-x-y, note: "Eksamensoppgaver skriver også $\\chi_\\pm^x$." }
  - { tex: "\\vec\\sigma", meaning: "Paulimatrisene $(\\sigma_x, \\sigma_y, \\sigma_z)$", section: "Spinn", term: "Paulimatrisene", formula: paulimatrisene, note: "Dimensjonsløse, med $\\vec S = (\\hbar/2)\\vec\\sigma$. Eksamensoppgaver bruker også $\\sigma_A$ for standardavviket til $A$." }
  - { tex: "\\vec\\mu", meaning: "Magnetisk moment", unit: "J/T", section: "Spinn", term: "Magnetisk moment", formula: magnetisk-moment, note: "$\\vec\\mu_L$ for banebevegelsen, $\\vec\\mu_s$ for spinnet." }
  - { tex: "\\gamma,\\allowbreak\\ \\gamma_e", meaning: "Det gyromagnetiske forholdet", unit: "C/kg", section: "Spinn", term: "Gyromagnetisk forhold", formula: magnetisk-moment, note: "$\\gamma = q/2m$ for banebevegelse, $\\gamma_e = -g_ee/2m_e$ for elektronspinnet." }
  - { tex: "g_e", meaning: "g-faktoren til elektronet", section: "Spinn", term: "g-faktor", formula: elektronspinn-moment, note: "$2{,}0023$, nesten nøyaktig 2." }
  - { tex: "\\mu_B", meaning: "Bohr-magnetonet, $e\\hbar/2m_e$", unit: "J/T", section: "Spinn", term: "Bohr-magneton", formula: bohr-magneton, note: "$9{,}27\\cdot10^{-24}$ J/T, eller $5{,}79\\cdot10^{-5}$ eV/T." }
  - { tex: "q", meaning: "Ladningen til partikkelen", unit: "C", section: "Spinn", formula: magnetisk-moment, note: "$q = -e$ for elektronet." }
  - { tex: "\\vec B,\\allowbreak\\ B_0", meaning: "Magnetfeltet og styrken av det", unit: "T", section: "Spinn", formula: spinn-i-magnetfelt, note: "I Stern–Gerlach-magneten er $B_0$ den homogene delen av feltet." }
  - { tex: "\\omega_L", meaning: "Larmor-frekvensen", unit: "s⁻¹", section: "Spinn", term: "Larmor-presesjon", formula: larmor-presesjon, note: "$|\\gamma|B$. For elektronspinnet er den $g_eeB/2m_e = 1{,}76\\cdot10^{11}\\ \\text{s}^{-1}$ ved 1 T. Ikke oscillatorens $\\omega$." }
  - { tex: "\\hat n,\\allowbreak\\ \\theta,\\allowbreak\\ \\varphi", meaning: "Enhetsvektoren langs en måleakse og vinklene som angir den", section: "Spinn", formula: spinn-langs-n, note: "$\\hat n = (\\sin\\theta\\cos\\varphi, \\sin\\theta\\sin\\varphi, \\cos\\theta)$, de samme vinklene som i kulekoordinater." }
  # ── Konstanter ──
  - { tex: "h,\\ \\hbar", meaning: "Plancks konstant og $\\hbar = h/2\\pi$", unit: "J·s", section: "Konstanter", id: hbar }
  - { tex: "e", meaning: "Elementærladningen", unit: "C", section: "Konstanter", note: "Hydrogenpotensialet er $V(r) = -e^2/4\\pi\\varepsilon_0 r$." }
  - { tex: "\\varepsilon_0", meaning: "Permittiviteten i vakuum", unit: "F/m", section: "Konstanter" }
  - { tex: "m_e", meaning: "Elektronmassen", unit: "kg", section: "Konstanter", note: "Radiallikningen skriver massen $m$; for hydrogen er den $m_e$." }
  - { tex: "a_0", meaning: "Bohrradien", unit: "Å", section: "Konstanter", term: "Bohrradius", note: "$0{,}529$ Å." }
  - { tex: "\\alpha", meaning: "Finstrukturkonstanten", section: "Konstanter", term: "Finstrukturkonstanten", id: finstrukturkonstanten, note: "$\\alpha \\approx 1/137$, dimensjonsløs. Ikke egenverdien $\\alpha$ til en koherent tilstand." }

# ── Begreper ─────────────────────────────────────────────────────────────────
glossary:
  - term: "Foton"
    definition: "Lyskvantet. Har energi $E = h\\nu$ og impuls $p = h/\\lambda$."
    section: "Repetisjon og postulater"
  - term: "Frigjøringsarbeid"
    definition: "Energien $W$ som må til for å løsrive de løsest bundne elektronene fra et metall."
    section: "Repetisjon og postulater"
  - term: "Comptonbølgelengde"
    definition: "$\\lambda_C = h/m_ec = 2{,}43$ pm for elektronet. Setter skalaen for Compton-forskyvningen."
    section: "Repetisjon og postulater"
  - term: "Stasjonær tilstand"
    definition: "Tilstand med skarp energi. Et atom i en stasjonær tilstand stråler ikke."
    section: "Repetisjon og postulater"
  - term: "Bølge-partikkel-dualitet"
    definition: "Lys og materie har både bølge- og partikkelegenskaper. Bølgen bestemmer sannsynlighetsfordelingen, partikkelen viser seg i hver enkelt deteksjon."
    section: "Repetisjon og postulater"
  - term: "de Broglie-bølgelengde"
    definition: "Bølgelengden $\\lambda = h/p$ knyttet til en partikkel med impuls $p$."
    section: "Repetisjon og postulater"
  - term: "Bølgefunksjon"
    definition: "Funksjonen $\\Psi$ som beskriver tilstanden til et system. $|\\Psi|^2$ gir sannsynlighetsfordelingen; $\\Psi$ selv kan ikke måles."
    section: "Repetisjon og postulater"
  - term: "Bohrradius"
    definition: "$a_0 = 4\\pi\\varepsilon_0\\hbar^2/m_ee^2 = 0{,}529$ Å. Lengdeskalaen for hydrogenatomet."
    section: "Repetisjon og postulater"
  - term: "Finstrukturkonstanten"
    definition: "$\\alpha = e^2/4\\pi\\varepsilon_0\\hbar c \\approx 1/137$. Dimensjonsløs; angir styrken på den elektromagnetiske vekselvirkningen."
    section: "Repetisjon og postulater"

  - term: "Observabel"
    definition: "Målbar fysisk størrelse. Representeres i teorien av en lineær operator."
    section: "Repetisjon og postulater"
  - term: "Forventningsverdi"
    definition: "Gjennomsnittet måleverdiene nærmer seg når observabelen måles mange ganger på et ensemble preparert i samme tilstand."
    section: "Repetisjon og postulater"
  - term: "Degenerasjon"
    definition: "At en egenverdi har flere lineært uavhengige egenfunksjoner. Antallet $g_n$ er degenerasjonsgraden."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Kollaps"
    definition: "Målingen fjerner den delen av bølgefunksjonen som ikke er forenlig med måleresultatet."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Bevegelseskonstant"
    definition: "Størrelse med tidsuavhengig forventningsverdi: en tidsuavhengig operator som kommuterer med $\\hat H$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Impulsrommet"
    definition: "Formuleringen der $\\Phi(p, t)$ er bølgefunksjonen. Der er $\\hat p = p$ og $\\hat x = -(\\hbar/i)\\,\\partial/\\partial p$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Ehrenfests teorem"
    definition: "Forventningsverdiene følger likninger med samme form som Newtons: $d\\langle x \\rangle/dt = \\langle p \\rangle/m$ og $d\\langle p \\rangle/dt = -\\langle V'(x) \\rangle$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Egenrom"
    definition: "Alle egenfunksjoner som hører til samme egenverdi $f_n$. Dimensjonen er degenerasjonsgraden $g_n$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Kompatible observable"
    definition: "Observable med kommuterende operatorer. De har felles egenfunksjoner og kan ha skarpe verdier samtidig."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Deltafunksjonsnormering"
    definition: "Normering av egenfunksjoner med kontinuerlig spektrum: $\\int \\psi_{f'}^*\\psi_f\\,d\\tau = \\delta(f - f')$ i stedet for $\\delta_{nn'}$."
    section: "Tidsutvikling, måling og impulsrommet"
  - term: "Tilstandsvektor"
    definition: "Vektoren $|\\psi\\rangle$ i Hilbertrommet som beskriver tilstanden. Bølgefunksjonen $\\psi(x) = \\langle x|\\psi\\rangle$ er komponentene dens i posisjonsbasisen."
    section: "Diracnotasjon og representasjoner"
  - term: "Hilbertrom"
    definition: "Komplekst, lineært vektorrom med skalarprodukt. For bølgefunksjoner er det de kvadratisk integrerbare funksjonene, $L^2$."
    section: "Diracnotasjon og representasjoner"
  - term: "Bra og ket"
    definition: "Ketvektoren $|a\\rangle$ er en tilstandsvektor, bravektoren $\\langle a|$ den duale vektoren. Sammen gir de skalarproduktet $\\langle a|b\\rangle$."
    section: "Diracnotasjon og representasjoner"
  - term: "Fullstendighetsrelasjonen"
    definition: "$\\sum_n |n\\rangle\\langle n| = \\mathbb{1}$ for et ortonormert basissett. Settes inn i et uttrykk for å bytte basis."
    section: "Diracnotasjon og representasjoner"
  - term: "Projeksjonsoperator"
    definition: "$\\hat P_n = |n\\rangle\\langle n|$. Plukker ut den delen av en vektor som peker langs $|n\\rangle$. Hermitesk, med $\\hat P_n^2 = \\hat P_n$."
    section: "Diracnotasjon og representasjoner"
  - term: "Adjungert operator"
    definition: "$\\hat A^\\dagger$, definert ved $\\langle a|\\hat A^\\dagger|b\\rangle = \\langle b|\\hat A|a\\rangle^*$. Den duale vektoren til $\\hat A|a\\rangle$ er $\\langle a|\\hat A^\\dagger$."
    section: "Diracnotasjon og representasjoner"
  - term: "Hermitesk operator"
    definition: "Operator med $\\hat A^\\dagger = \\hat A$. Har reelle egenverdier og reelle forventningsverdier, og observable svarer til hermiteske operatorer."
    section: "Diracnotasjon og representasjoner"
  - term: "Spektrum"
    definition: "Mengden av egenverdier til en operator. Kan være diskret, kontinuerlig eller begge deler."
    section: "Diracnotasjon og representasjoner"
  - term: "Representasjon"
    definition: "Den generelle formuleringen projisert på en bestemt basis. Posisjonsbasisen gir bølgemekanikk i $x$, impulsbasisen gir impulsrommet, og en diskret basis gir matrisemekanikk."
    section: "Diracnotasjon og representasjoner"
  - term: "Posisjonsrepresentasjonen"
    definition: "Kvantemekanikken med egenvektorene $|x'\\rangle$ til $\\hat x$ som basis. Der er $\\psi(x) = \\langle x|\\psi\\rangle$ bølgefunksjonen og $(\\hbar/i)\\,\\partial/\\partial x$ impulsoperatoren."
    section: "Diracnotasjon og representasjoner"
  - term: "Matrisemekanikk"
    definition: "Kvantemekanikken i en diskret basis: tilstander er kolonnematriser $a_k = \\langle k|a\\rangle$ og operatorer er matriser $A_{kn} = \\langle k|\\hat A|n\\rangle$."
    section: "Diracnotasjon og representasjoner"

  - term: "Algebraisk metode"
    definition: "Å løse et egenverdiproblem med operatoralgebra alene, uten å velge noen basis. Kalles også operatormetoden."
    section: "Harmonisk oscillator"
  - term: "Stigeoperatorer"
    definition: "Samlenavn på $a$ og $a^\\dagger$: senkeoperatoren $a$ senker og heveoperatoren $a^\\dagger$ hever energien ett trinn $\\hbar\\omega$. De er hverandres adjungerte og ikke hermiteske."
    section: "Harmonisk oscillator"
  - term: "Talloperator"
    definition: "$\\hat N = a^\\dagger a$, med $\\hat N|n\\rangle = n|n\\rangle$. Egenverdien teller kvantene $\\hbar\\omega$ over nullpunktsenergien."
    section: "Harmonisk oscillator"
  - term: "Nullpunktsenergi"
    definition: "Grunntilstandsenergien $E_0 = \\tfrac12\\hbar\\omega$. Oscillatoren har den fordi $\\Delta x$ og $\\Delta p$ ikke kan være null samtidig."
    section: "Harmonisk oscillator"
  - term: "Koherent tilstand"
    definition: "Egentilstand av senkeoperatoren, $a|\\alpha\\rangle = \\alpha|\\alpha\\rangle$: en gausspakke med grunntilstandens bredde som svinger som en klassisk partikkel med amplitude $|\\alpha|\\sqrt{2\\hbar/m\\omega}$."
    section: "Harmonisk oscillator"
  - term: "Tidsutviklingsoperator"
    definition: "$\\hat U(t, t_0) = e^{-i(t - t_0)\\hat H/\\hbar}$, som fører en tilstand fra $t_0$ til $t$. Den er unitær, så normen er bevart."
    section: "Harmonisk oscillator"
  - term: "Schrödingerbildet"
    definition: "Beskrivelsen der tilstanden $|\\Psi, t\\rangle$ utvikler seg i tid og operatorene står fast. Guiden bruker den der ikke annet er sagt."
    section: "Harmonisk oscillator"
  - term: "Heisenbergbildet"
    definition: "Beskrivelsen der tilstanden står fast og operatorene utvikler seg, $\\hat F_H(t) = \\hat U^\\dagger\\hat F\\hat U$. Gir de samme forventningsverdiene som Schrödingerbildet."
    section: "Harmonisk oscillator"

  - term: "Dreieimpuls"
    definition: "Vektor $\\vec J$ av tre hermiteske operatorer med $[J_i, J_j] = i\\hbar\\sum_k\\varepsilon_{ijk}J_k$. Egenverdiene er $\\hbar^2 j(j+1)$ for $J^2$ og $\\hbar m$ for $J_z$."
    section: "Dreieimpuls"
  - term: "Banedreieimpuls"
    definition: "$\\vec L = \\vec r \\times \\vec p$, dreieimpulsen knyttet til bevegelse i rommet. Har bare heltallige $l$ og $m$."
    section: "Dreieimpuls"
  - term: "Kuleflatefunksjoner"
    definition: "$Y_{lm}(\\theta, \\varphi) = \\langle \\theta, \\varphi|l, m\\rangle$, de felles egenfunksjonene til $L^2$ og $L_z$. Et ortonormert, fullstendig sett på kuleflaten."
    section: "Dreieimpuls"
  - term: "Sentralsymmetrisk potensial"
    definition: "Potensial som bare avhenger av avstanden $r$ fra origo. Da er $L^2$ og alle komponentene av $\\vec L$ bevegelseskonstanter."
    section: "Dreieimpuls"
  - term: "Radiallikningen"
    definition: "Den endimensjonale likningen for $u(r) = rR(r)$ som står igjen når vinkeldelen $Y_{lm}$ er skilt ut i et sentralsymmetrisk potensial."
    section: "Dreieimpuls"
  - term: "Sentrifugalpotensialet"
    definition: "Leddet $\\hbar^2 l(l+1)/2mr^2$ i radiallikningen: den kinetiske energien i bevegelsen rundt origo. Holder partikkelen borte fra sentrum når $l > 0$."
    section: "Dreieimpuls"

  - term: "Spinn"
    definition: "Indre dreieimpuls $\\vec S$ som ikke kommer av bevegelse i rommet. Komponentene oppfyller $[S_i, S_j] = i\\hbar\\sum_k\\varepsilon_{ijk}S_k$, og elektronet, protonet og nøytronet har $s = \\tfrac12$."
    section: "Spinn"
  - term: "Magnetisk moment"
    definition: "Vektoren $\\vec\\mu$ som gir energien $-\\vec\\mu\\cdot\\vec B$ i et magnetfelt. For en dreieimpuls er $\\vec\\mu = \\gamma\\vec J$, der $\\gamma$ er det gyromagnetiske forholdet."
    section: "Spinn"
  - term: "Gyromagnetisk forhold"
    definition: "Forholdet $\\gamma$ i $\\vec\\mu = \\gamma\\vec J$. For banebevegelse er $\\gamma = q/2m$, for elektronspinnet $\\gamma_e = -g_ee/2m_e$."
    section: "Spinn"
  - term: "g-faktor"
    definition: "Det dimensjonsløse tallet $g$ i $\\vec\\mu = g\\,(q/2m)\\,\\vec J$, også kalt gyromagnetisk faktor. $g = 1$ for banedreieimpuls og $g_e = 2{,}0023$ for elektronspinnet."
    section: "Spinn"
  - term: "Bohr-magneton"
    definition: "$\\mu_B = e\\hbar/2m_e = 5{,}79\\cdot10^{-5}$ eV/T, størrelsen på magnetiske momenter i atomer."
    section: "Spinn"
  - term: "Larmor-presesjon"
    definition: "Et magnetisk moment i et homogent felt dreier rundt feltet med fast vinkel mot det og vinkelfrekvensen $\\omega_L = |\\gamma|B$. For spinnet gjelder det forventningsverdien $\\langle\\vec S\\rangle$."
    section: "Spinn"
  - term: "Stern–Gerlach-eksperimentet"
    definition: "En stråle av sølvatomer sendes gjennom et inhomogent magnetfelt, som avbøyer hvert atom etter $\\mu_z$. Strålen deles i to, og det viser at elektronet har spinn $\\tfrac12$."
    section: "Spinn"
  - term: "Spinor"
    definition: "Søylevektoren $\\chi = (a_+, a_-)^T$ som representerer en spinn-½-tilstand i basisen $\\{|{\\uparrow}\\rangle, |{\\downarrow}\\rangle\\}$."
    section: "Spinn"
  - term: "Paulimatrisene"
    definition: "De tre dimensjonsløse $2\\times2$-matrisene $\\sigma_x$, $\\sigma_y$ og $\\sigma_z$, med $\\vec S = (\\hbar/2)\\vec\\sigma$ for spinn ½."
    section: "Spinn"
  - term: "Spinnretning"
    definition: "Forventningsverdien $\\langle\\vec S\\rangle$. For spinn ½ har den lengden $\\hbar/2$, og tilstanden er spinn opp langs den. Retningen til selve $\\vec S$ er ingen observabel."
    section: "Spinn"
